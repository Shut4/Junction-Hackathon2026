<text x="1145" y="425" class="pin">D1 / GPIO3</text>
<text x="1046" y="485" class="pin">GND</text>
<text x="1050" y="509" class="small">USB-C：書き込み・デバッグ</text>
<polyline class="wire" stroke="#526170" points="1030,480 1000,480 1000,535"/>
<polyline class="wire" stroke="#526170" points="1000,535 1000,557"/>
