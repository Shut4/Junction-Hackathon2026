<text x="1225" y="815" class="pin">OUT1</text>
<text x="1225" y="895" class="pin">OUT2</text>
<polyline class="wire" stroke="#526170" points="1030,910 995,910 995,950 1030,950"/>
<circle cx="995" cy="950" r="6" fill="#526170"/>
<polyline class="wire" stroke="#526170" points="995,975 995,997"/>
