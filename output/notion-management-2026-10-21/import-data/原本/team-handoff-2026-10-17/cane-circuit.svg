<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260"><rect width="1800" height="1260" fill="#f7f9fc"/><style>text{font-family:'Hiragino Sans','Noto Sans CJK JP',sans-serif;fill:#183047} .head{font-size:34px;font-weight:700}.title{font-size:20px;font-weight:700}.label{font-size:20px}.small{font-size:16px}.pin{font-size:19px;font-family:monospace} .wire{fill:none;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}</style>
<text x="60" y="65" class="head">白杖振動デバイス｜全体接続回路図</text>
<text x="60" y="105" class="label">単3アルカリ電池2本 / XIAO ESP32C3 / AE-TPS63802 / AE-DRV8835-P / LBV10B-009</text>
<text x="60" y="140" class="small">モジュール間の接続図。箱内は基板の実装位置・端子順を示しません。未実機検証。</text>
<rect x="60" y="230" width="260" height="200" rx="12" fill="white" stroke="#9eafc2" stroke-width="2"/>
