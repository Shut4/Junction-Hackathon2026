<polyline class="wire" stroke="#526170" points="985,1005 1005,1005"/>
<polyline class="wire" stroke="#526170" points="991,1013 999,1013"/>
<text x="973" y="1038" class="small">GND</text>
<polyline class="wire" stroke="#526170" points="1180,1010 1180,1035"/>
<polyline class="wire" stroke="#526170" points="1180,1035 1180,1057"/>
<polyline class="wire" stroke="#526170" points="1164,1057 1196,1057"/>
<polyline class="wire" stroke="#526170" points="1170,1065 1190,1065"/>
<polyline class="wire" stroke="#526170" points="1176,1073 1184,1073"/>
<text x="1158" y="1098" class="small">GND</text>
<polyline class="wire" stroke="#cf3c35" points="1330,820 1500,820"/>
<polyline class="wire" stroke="#526170" points="1330,900 1500,900"/>
<rect x="1500" y="740" width="245" height="215" rx="12" fill="white" stroke="#9eafc2" stroke-width="2"/>
<text x="1518" y="772" class="title">M1：LBV10B-009</text>
<text x="1518" y="801" class="small">3V / 50mA（定格）</text>
<text x="1516" y="846" class="pin">＋：OUT1へ</text>
<text x="1516" y="908" class="pin">－：OUT2へ</text>
<text x="1460" y="998" class="small">BLDC内蔵：極性固定</text>
<text x="1460" y="1027" class="small">長さの異なるパルスで通知</text>
<rect x="60" y="645" width="755" height="425" rx="12" fill="white" stroke="#9eafc2" stroke-width="2"/>
<text x="78" y="677" class="title">配線・設定メモ</text>
<text x="78" y="706" class="small">接続点の黒丸以外の線の交差は、電気的に接続しない</text>
<text x="80" y="746" class="small">① GND記号のある端子は全て同じ電池の－につなぐ。</text>
<text x="80" y="786" class="small">② IN2=GND、MODE=GND。J1を使う場合はLOW側。</text>
<text x="80" y="826" class="small">③ IN1=HIGHで振動、LOWで出力開放（Hi-Z）。</text>
<text x="80" y="866" class="small">④ IN1/IN2/MODEはIC内にプルダウンあり。</text>
<text x="80" y="906" class="small">⑤ 回転方向を反転する信号やブレーキ制御は使わない。</text>
<text x="80" y="946" class="small">⑥ 電池電圧低下時はモーター停止・再起動の確認が必要。</text>
<text x="80" y="986" class="small">⑦ USB接続中はSW1を切ってもXIAOが動作する。</text>
<text x="80" y="1026" class="small">※ ENは基板内でVINへプルアップ済み。VR1を必ず実装。</text>
<rect x="60" y="1140" width="1685" height="75" rx="10" fill="#e7edf5"/>
<text x="80" y="1170" class="label">電源経路：電池 → U1 → D1 → XIAO ／ 電池 → DRV8835 VM → モーター</text>
<text x="80" y="1200" class="small">確認：電池の極性、U1の出力5.00V、D1の向き、OUT1/OUT2の極性。グリップ収納寸法は別途実測。</text>
</svg>