<text x="1488" y="262" class="title">iPhone</text>
<text x="1488" y="291" class="small">全長110cmの白杖と連動</text>
<text x="1490" y="330" class="small">首掛け・背面カメラを</text>
<text x="1490" y="360" class="small">進行方向に向ける</text>
<text x="1490" y="410" class="small">検知：深度＋傾き</text>
<path d="M1460 285 H1350" stroke="#226bd1" stroke-width="3" stroke-dasharray="9 7" fill="none"/>
<text x="1375" y="266" class="pin" style="fill:#226bd1">BLE</text>
<polyline class="wire" stroke="#138051" points="1330,360 1410,360 1410,610 970,610 970,810 1030,810"/>
<text x="1045" y="598" class="small" style="fill:#138051">3.3V：ロジック電源</text>
<polyline class="wire" stroke="#226bd1" points="1330,420 1370,420 1370,655 940,655 940,860 1030,860"/>
<text x="1030" y="645" class="small" style="fill:#226bd1">振動指示：HIGH=ON / LOW=OFF</text>
<rect x="1030" y="700" width="300" height="310" rx="12" fill="white" stroke="#9eafc2" stroke-width="2"/>
<text x="1048" y="732" class="title">U3：AE-DRV8835-P</text>
<text x="1048" y="761" class="small"></text>
<text x="1045" y="755" class="pin">CN2 VM</text>
