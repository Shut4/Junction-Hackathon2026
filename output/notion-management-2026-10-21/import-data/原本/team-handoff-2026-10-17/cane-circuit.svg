<text x="858" y="274" class="small">A → K（帯側）</text>
<text x="927" y="347" class="small" style="fill:#cc7a00">約4.6〜4.9V</text>
<rect x="1030" y="230" width="300" height="290" rx="12" fill="white" stroke="#9eafc2" stroke-width="2"/>
<text x="1048" y="262" class="title">U2：XIAO ESP32C3</text>
<text x="1048" y="291" class="small">iPhoneとBLE通信 / 外付けアンテナ</text>
<text x="1044" y="305" class="pin">5V</text>
