name: Regional road data
on:
  pull_request:
    paths:
      - 'Data/**'
      - 'Scripts/**'
      - 'Tests/Scripts/**'
      - '.github/workflows/network-data.yml'
  push:
    branches: [main]
    paths:
      - 'Data/**'
      - 'Scripts/**'
      - 'Tests/Scripts/**'
      - '.github/workflows/network-data.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 Scripts/build_network.py --check
      - run: python3 -m unittest discover -s Tests/Scripts -v
